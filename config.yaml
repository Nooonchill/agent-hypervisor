version: 2
data-dir: .hypervisor

task-form:
  request:
    label: Initial request
    required: true
    default: ""
  goal:
    label: Overall goal
    required: false
    default: ""
  sources:
    label: Sources and context
    type: multiline
    description: References, links or background information in free text.
    placeholder: Describe the available sources and context…
    required: false
    default: ""
  constraints:
    label: Additional constraints
    required: false
    default: ""

agents:
  - agent-id: spec-writer
    agent-name: Spec Writer
    model: null
    instructions: >-
      You document the task requirements and acceptance criteria using the user's
      request, constraints and available sources. Wait for an assigned stage before working.

  - agent-id: developer
    agent-name: Developer
    model: null
    instructions: >-
      You implement the assigned task and verify it with relevant tests.
      Preserve unrelated work. Wait for an assigned stage before working.

  - agent-id: architect
    agent-name: Architect
    model: null
    instructions: >-
      You independently review assigned artifacts against the task requirements,
      correctness and maintainability. Report concrete findings with evidence.
      Wait for an assigned review before working.

flows:
  - id: intent-implementation
    name: Intent and implementation
    task-form:
      request:
        label: Feature request
      goal:
        label: Expected result
    steps:
      - id: intent
        agent-id: spec-writer
        goal: Analyze the user's request, constraints, and available sources. Document requirements and acceptance criteria using locations appropriate to the task and repository.
        reviewer-id: architect
        review-goal: Confirm the intent captures the request, scope, requirements, and acceptance criteria without adding unsupported requirements.
        review-scope:
          - "**/*"
        auto-commit: false
        create-pr: false
        human-approval: false

      - id: implementation
        agent-id: developer
        goal: Implement the approved intent and verify its acceptance criteria.
        reviewer-id: architect
        review-goal: Check the implementation against the intent, correctness, maintainability, and relevant test coverage.
        review-scope:
          - src/**
          - tests/**
        checks:
          - id: unit-tests
            command: [uv, run, python, -m, unittest, discover, -s, tests, -v]
            timeout: 300
        auto-commit: false
        create-pr: false
        human-approval: true

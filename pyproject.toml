[project]
name = "agent-hypervisor"
version = "0.1.0"
description = "A compact tmux hypervisor for Qwen-compatible terminal groups"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual>=8.0",
    "pyyaml>=6.0",
    "mcp>=1.28,<2",
]

[project.scripts]
hypervisor = "agent_hypervisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hypervisor"]

[tool.ruff]
target-version = "py314"
line-length = 100
